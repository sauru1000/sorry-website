<!DOCTYPE html>
<html>
<head>
    <title>I'm Really Sorry ❤️</title>
    <style>
        body {
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }
        .box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 60%;
            margin: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        h1 {
            color: #ff4d6d;
        }
        p {
            font-size: 18px;
            color: #333;
        }
        button {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #e63950;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>I'm Really Sorry ❤️</h1>
    <p>
        I know I made a mistake and I never meant to hurt you.  
        eni njn oriklum cheyoolhh.  
        Please forgive me? 🥺
    </p>
    <button onclick="showLove()">Click if you forgive me 💕</button>
</div>

<script>
function showLove() {
    alert("Thank you for forgiving me ❤️ I promise to do better!");
}
</script>

</body>
</html>
